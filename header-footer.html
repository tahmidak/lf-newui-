<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header &amp; Footer - lf</title>

    <!-- Fonts: Lato (UI/body), Open Sans (logo wordmark) — see tokens.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/main.css" rel="stylesheet">
</head>
<body>

    <!-- ============================================
        HEADER
        abbr: lf-header
        Bootstrap JS doing real work here:
        - offcanvas: the mobile menu (#lfHeaderMenu)
        - collapse:  the mobile search row (#lfHeaderSearch)
    ============================================ -->
    <header class="lf-header" data-lf-header>
        <nav class="navbar navbar-expand-lg lf-header-bar" aria-label="Main">
            <div class="lf-container d-flex flex-wrap flex-lg-nowrap align-items-center">

                <!-- DYNAMIC: home_url() -->
                <!-- The mark is a traced placeholder — swap for the real logo file. -->
                <a class="lf-header-logo" href="home.html">
                    <!-- DYNAMIC: the_custom_logo() -->
                    <img class="lf-header-logo-img" src="assets/imgs/lf-logo.svg" alt="Learning Facility" width="225" height="70">
                </a>

                <!-- Search: always visible from lg; a collapse row below lg -->
                <div class="collapse d-lg-block order-last order-lg-0 lf-header-search" id="lfHeaderSearch">
                    <!-- DYNAMIC: action = home_url('/'), post_type = Tutor LMS courses -->
                    <form class="lf-header-search-form" role="search" action="#" method="get">
                        <label class="visually-hidden" for="lfHeaderSearchInput">Search courses</label>
                        <input class="lf-header-search-input" id="lfHeaderSearchInput" type="search" name="s" placeholder="Search Courses ...">
                        <input type="hidden" name="post_type" value="courses">
                        <button class="lf-header-search-submit" type="submit" aria-label="Search">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" focusable="false">
                                <circle cx="10.5" cy="10.5" r="7"/>
                                <path d="m15.75 15.75 5.25 5.25"/>
                            </svg>
                        </button>
                    </form>
                </div>

                <!-- Nav: inline from lg; an offcanvas panel below lg -->
                <div class="offcanvas offcanvas-top lf-header-menu" id="lfHeaderMenu" tabindex="-1" aria-label="Main menu" data-lf-header-menu>
                    <div class="offcanvas-body">
                        <!-- DYNAMIC: wp_nav_menu( primary ) — one <li> per menu item -->
                        <ul class="navbar-nav ms-lg-auto lf-header-nav">
                            <li class="nav-item">
                                <a class="nav-link lf-header-link" href="home.html" aria-current="page">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link lf-header-link lf-header-link-hot" href="hot-deals.html">Hot Deals<span aria-hidden="true">🔥</span></a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link lf-header-link" href="courses.html">All Courses</a>
                            </li>
                            <li class="nav-item">
                                <!-- DYNAMIC: login / dashboard link depending on is_user_logged_in() -->
                                <a class="nav-link lf-header-link" href="#">Log In/Sign Up</a>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="d-flex align-items-center ms-auto lf-header-actions">
                    <button class="lf-header-icon-btn d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#lfHeaderSearch" aria-controls="lfHeaderSearch" aria-expanded="false" aria-label="Search courses">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" focusable="false">
                            <circle cx="10.5" cy="10.5" r="7"/>
                            <path d="m15.75 15.75 5.25 5.25"/>
                        </svg>
                    </button>

                    <!-- DYNAMIC: wc_get_cart_url() -->
                    <a class="lf-header-icon-btn" href="cart.html" aria-label="Cart">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <path d="M1.5 2.5h2.75l2.5 12.5h12.5l2.5-9H5.5"/>
                            <circle cx="9" cy="19.75" r="1.75"/>
                            <circle cx="17" cy="19.75" r="1.75"/>
                        </svg>
                    </a>

                    <button class="lf-header-icon-btn d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#lfHeaderMenu" aria-controls="lfHeaderMenu" aria-expanded="false" aria-label="Menu">
                        <svg class="lf-header-icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" aria-hidden="true" focusable="false">
                            <path d="M3 5h18M3 12h18M3 19h18"/>
                        </svg>
                        <svg class="lf-header-icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" aria-hidden="true" focusable="false">
                            <path d="M5 5l14 14M19 5 5 19"/>
                        </svg>
                    </button>
                </div>

            </div>
        </nav>
    </header>

    <main>
        <!-- Page sections go here -->
    </main>

    <!-- ============================================
        FOOTER
        abbr: lf-footer
    ============================================ -->
    <footer class="lf-section lf-footer lf-bg-purple">
        <div class="lf-container">
            <div class="row gy-5">

                <div class="col-12 col-lg-4 col-xl-3">
                    <!-- DYNAMIC: home_url() -->
                    <!-- The mark is a traced placeholder — swap for the real logo file. -->
                    <a class="lf-footer-logo" href="home.html">
                        <!-- DYNAMIC: the_custom_logo() -->
                        <img class="lf-footer-logo-img" src="assets/imgs/lf-logo-white.svg" alt="Learning Facility" width="225" height="70">
                    </a>
                </div>

                <nav class="col-md-6 col-lg-4 col-xl-3" aria-labelledby="lfFooterTermsTitle">
                    <h2 class="lf-footer-title" id="lfFooterTermsTitle">Our Terms</h2>
                    <!-- DYNAMIC: wp_nav_menu( footer-terms ) -->
                    <ul class="lf-footer-links">
                        <li><a class="lf-footer-link" href="#">Terms and Conditions</a></li>
                        <li><a class="lf-footer-link" href="#">Privacy Policy</a></li>
                        <li><a class="lf-footer-link" href="#">Disclaimer</a></li>
                    </ul>
                </nav>

                <nav class="col-md-6 col-lg-4 col-xl-3" aria-labelledby="lfFooterLinksTitle">
                    <h2 class="lf-footer-title" id="lfFooterLinksTitle">Important Links</h2>
                    <!-- DYNAMIC: wp_nav_menu( footer-links ) -->
                    <ul class="lf-footer-links">
                        <li><a class="lf-footer-link" href="#">Contact</a></li>
                        <li><a class="lf-footer-link" href="blog.html">Blogs</a></li>
                        <li><a class="lf-footer-link" href="#">Certificate Order</a></li>
                    </ul>
                </nav>

            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
